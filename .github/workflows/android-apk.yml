name: Build Privacy Flip APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Android source
        run: |
          mkdir -p privacy-flip-android
          unzip -q PrivacyFlip-Android-Source.zip -d privacy-flip-android
          PROJECT_FILE="$(find privacy-flip-android -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "Could not find settings.gradle.kts in source archive."
            find privacy-flip-android -maxdepth 4 -type f | head -80
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at: $PROJECT_DIR"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses and install packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify source structure
        run: python3 "$PROJECT_DIR/tools/verify_source.py"
      - name: Fix missing Material3 import
        run: |
          MAIN_FILE="$PROJECT_DIR/app/src/main/java/com/privacyflip/app/MainActivity.kt"
          if ! grep -q '^import androidx.compose.material3.NavigationBarItem$' "$MAIN_FILE"; then
            sed -i '/^package /a import androidx.compose.material3.NavigationBarItem' "$MAIN_FILE"
          fi
          grep -n 'NavigationBarItem' "$MAIN_FILE"
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: privacy-flip-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
