name: Build Privacy Flip APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble source archive
        run: |
          cat source/part*.txt | base64 -d > privacy-flip-android-source.zip
          unzip -q privacy-flip-android-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify source structure
        run: python3 privacy-flip-android/tools/verify_source.py
      - name: Build debug APK
        working-directory: privacy-flip-android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: privacy-flip-debug-apk
          path: privacy-flip-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
